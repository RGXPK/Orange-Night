  header {
    background: #FF9D00;
    padding: 10px;
    text-align: center;
    color: #000;
    position: relative;
  }
  .controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  select, input {
    padding: 8px;
    font-size: 14px;
    border: 2px solid #ffeb3b;
    border-radius: 5px;
    background: #000;
    color: #ffeb3b;
  }

    color: #ffeb3b;
  }

  .grid {

    gap: 15px;
    padding: 20px;

    background: #222;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 2px 5px rgba(255, 235, 59, 0.5);
    text-align: center;
    cursor: pointer;
    transition: transform 0.2s;
    color: #ffeb3b;
    position: relative;
  }
  .card:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 15px rgba(255, 235, 59, 0.9);
  }
  .card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-bottom: 2px solid #ffeb3b;
  }
  .card-buttons {
    position: absolute;
    top: 5px;
    left: 5px;
    display: flex;
    gap: 5px;
  }
  .card-buttons button {
    background: #FF8301;
    border: none;
    color: #000;
    padding: 5px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 12px;

    border-bottom: 2px solid #FF9100;
  }
  #detailPage h2 {
    margin-top: 10px;
  }
  #detailPage p {
    margin: 10px 0;
  }
  #backBtn {
    background: #FF8301;
    border: none;
    color: #000;
    padding: 10px 15px;
    cursor: pointer;
    border-radius: 5px;
    font-weight: bold;
    margin-bottom: 10px;
    transition: background 0.3s;
  }
  #backBtn:hover {
    background: #FF7900;
  }
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    justify-content: center;
    align-items: center;
  }
  .modal-content {
    background: #222;
    padding: 20px;
    border-radius: 10px;
    width: 90%;
    max-width: 500px;
    color: #ffeb3b;
    max-height: 90vh;

  .modal-content h3 {
    margin-top: 0;
    text-align: center;
  }
  .modal-content label {
    display: block;
    margin: 10px 0 5px;

    margin-bottom: 5px;

</style>

// دالة للبحث في قائمة البلدان
function setupCountrySearch(searchInput, countrySelect) {
  searchInput.addEventListener("input", function() {
    const searchTerm = this.value.trim().toLowerCase();
    const options = countrySelect.options;
    
    for (let i = 0; i < options.length; i++) {
      const option = options[i];
      if (option.value === "all") {
        option.style.display = searchTerm ? "none" : "";
        continue;
      }
      
      if (option.text.toLowerCase().includes(searchTerm)) {
        option.style.display = "";
      } else {
        option.style.display = "none";
      }
    }
  });
}

  const selectedCountry = filterCountry.value;
  
  grid.innerHTML = "";
  
  let filtered = actresses.filter(a => {
    const matchesSearch = a.name.toLowerCase().includes(searchTerm);
    const matchesType = selectedType === "all" || a.types.includes(selectedType);
    const matchesCountry = selectedCountry === "all" || a.country === selectedCountry;
    return matchesSearch && matchesType && matchesCountry;
  });
  
  if (filtered.length === 0) {
    grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center;'>لا توجد ممثلات مطابقة.</p>";

    });

      openEditModal(actress.id);
    });
    
    // حذف مع تأكيد

      }
    });
    
    grid.appendChild(card);
  });

    const actress = actresses.find(a => a.id === editingId);
    if (actress) {
      actress.name = name;
      actress.types = types;
      actress.country = country;
      actress.image = image;
      actress.bio = bio;
      actress.facebook = facebook;
      actress.instagram = instagram;
      actress.twitter = twitter;
    }
  } else {
    // إضافة جديدة
    const newId = actresses.length ? Math.max(...actresses.map(a => a.id)) + 1 : 1;
    actresses.push({
      id: newId,
      name,
      types,
      country,
      image,
      bio,
      facebook,
      instagram,
      twitter
    });
  }
  
  closeModal();
  renderList();
});

// تحديث العرض عند البحث أو الفلاتر
searchInput.addEventListener("input", renderList);
filterType.addEventListener("change", renderList);
filterCountry.addEventListener("change", renderList);

// تهيئة قوائم البلدان
document.addEventListener("DOMContentLoaded", function() {
  populateCountries(filterCountry);
  populateCountries(newCountry);
  
  // إعداد خاصية البحث للبلد في الواجهة الرئيسية
  setupCountrySearch(countrySearchInput, filterCountry);
  
  // إعداد خاصية البحث للبلد في المودال
  setupCountrySearch(modalCountrySearchInput, newCountry);
  
  // بدءاً بعرض القائمة
  renderList();
});
</script>
